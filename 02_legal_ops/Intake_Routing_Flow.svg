<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1450" viewBox="0 0 1200 1450"><title>Contract intake routing</title><desc>Ingrid Kao. Intake, risk routing, review and obligation management.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#56676d"/></marker></defs><rect width="1200" height="1450" fill="#f8f5ee"/><g font-family="DejaVu Sans,Arial,sans-serif" fill="#203944"><text x="50" y="45" font-size="15" fill="#0a66c2" font-weight="bold" text-anchor="start">INGRID KAO</text><text x="50" y="91" font-size="35" fill="#203944" font-weight="normal" text-anchor="start">Contract intake routing</text><text x="50" y="122" font-size="16" fill="#56676d" font-weight="normal" text-anchor="start">Proposed thresholds: USD100,000 for review and USD250,000 for senior review</text><rect x="365" y="155" width="470" height="119" rx="9" fill="#ffffff" stroke="#b9c7ca"/><rect x="365" y="155" width="5" height="119" rx="2" fill="#0a66c2"/><text x="386" y="186" font-size="20" fill="#0a66c2" font-weight="bold" text-anchor="start">1  Collect all structured facts</text><text x="386" y="215" font-size="17" fill="#203944" font-weight="normal" text-anchor="start">Request ID, owner, paper and USD value; every</text><text x="386" y="238" font-size="17" fill="#203944" font-weight="normal" text-anchor="start">risk flag; entity, authority and NDA gates.</text><path d="M 600 274 L 600 325" stroke="#56676d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="365" y="325" width="470" height="110" rx="9" fill="#ffffff" stroke="#b9c7ca"/><rect x="365" y="325" width="5" height="110" rx="2" fill="#0a66c2"/><text x="386" y="356" font-size="20" fill="#0a66c2" font-weight="bold" text-anchor="start">2  Known RED issue?</text><text x="386" y="385" font-size="17" fill="#203944" font-weight="normal" text-anchor="start">Critical risk flag or value &gt;= USD250,000.</text><text x="386" y="408" font-size="17" fill="#203944" font-weight="normal" text-anchor="start">Evaluate this before missing inputs.</text><path d="M 835 380 L 900 380" stroke="#56676d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="868" y="369" font-size="15" fill="#56676d" font-weight="bold" text-anchor="middle">Yes</text><rect x="900" y="300" width="250" height="167" rx="9" fill="#f8e9e5" stroke="#b9c7ca"/><rect x="900" y="300" width="5" height="167" rx="2" fill="#9d3e34"/><text x="921" y="331" font-size="20" fill="#9d3e34" font-weight="bold" text-anchor="start">RED / pause</text><text x="921" y="360" font-size="16" fill="#203944" font-weight="normal" text-anchor="start">Senior Legal, Finance,</text><text x="921" y="383" font-size="16" fill="#203944" font-weight="normal" text-anchor="start">business owner and</text><text x="921" y="406" font-size="16" fill="#203944" font-weight="normal" text-anchor="start">relevant specialist.</text><text x="921" y="429" font-size="16" fill="#203944" font-weight="normal" text-anchor="start">Preserve missing facts.</text><path d="M 600 435 L 600 515" stroke="#56676d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="620" y="477" font-size="15" fill="#56676d" font-weight="bold" text-anchor="middle">No</text><rect x="365" y="515" width="470" height="100" rx="9" fill="#ffffff" stroke="#b9c7ca"/><rect x="365" y="515" width="5" height="100" rx="2" fill="#0a66c2"/><text x="386" y="546" font-size="20" fill="#0a66c2" font-weight="bold" text-anchor="start">3  Required facts complete?</text><text x="386" y="575" font-size="17" fill="#203944" font-weight="normal" text-anchor="start">Valid amount, risk answers, verified entities</text><text x="386" y="598" font-size="17" fill="#203944" font-weight="normal" text-anchor="start">and signature authority.</text><path d="M 365 565 L 300 565" stroke="#56676d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="331" y="553" font-size="15" fill="#56676d" font-weight="bold" text-anchor="middle">No</text><rect x="50" y="490" width="250" height="146" rx="9" fill="#edf1f3" stroke="#b9c7ca"/><rect x="50" y="490" width="5" height="146" rx="2" fill="#56676d"/><text x="71" y="521" font-size="20" fill="#56676d" font-weight="bold" text-anchor="start">NEEDS INPUT</text><text x="71" y="550" font-size="16" fill="#203944" font-weight="normal" text-anchor="start">Requester + Legal</text><text x="71" y="573" font-size="16" fill="#203944" font-weight="normal" text-anchor="start">intake resolves missing</text><text x="71" y="596" font-size="16" fill="#203944" font-weight="normal" text-anchor="start">or invalid facts. Hold</text><text x="71" y="619" font-size="16" fill="#203944" font-weight="normal" text-anchor="start">execution.</text><path d="M 600 615 L 600 705" stroke="#56676d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="620" y="664" font-size="15" fill="#56676d" font-weight="bold" text-anchor="middle">Yes</text><rect x="365" y="705" width="470" height="142" rx="9" fill="#ffffff" stroke="#b9c7ca"/><rect x="365" y="705" width="5" height="142" rx="2" fill="#0a66c2"/><text x="386" y="736" font-size="20" fill="#0a66c2" font-weight="bold" text-anchor="start">4  All NDA gates pass?</text><text x="386" y="765" font-size="17" fill="#203944" font-weight="normal" text-anchor="start">Under USD100,000; unchanged approved mutual</text><text x="386" y="788" font-size="17" fill="#203944" font-weight="normal" text-anchor="start">NDA; routine purpose; validated policy; no</text><text x="386" y="811" font-size="17" fill="#203944" font-weight="normal" text-anchor="start">extra commercial restrictions.</text><path d="M 835 770 L 900 770" stroke="#56676d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="868" y="758" font-size="15" fill="#56676d" font-weight="bold" text-anchor="middle">No</text><rect x="900" y="686" width="250" height="168" rx="9" fill="#f6efdb" stroke="#b9c7ca"/><rect x="900" y="686" width="5" height="168" rx="2" fill="#8b6821"/><text x="921" y="717" font-size="20" fill="#8b6821" font-weight="bold" text-anchor="start">YELLOW / review</text><text x="921" y="746" font-size="16" fill="#203944" font-weight="normal" text-anchor="start">Legal + Finance reviews</text><text x="921" y="769" font-size="16" fill="#203944" font-weight="normal" text-anchor="start">value, paper or policy</text><text x="921" y="792" font-size="16" fill="#203944" font-weight="normal" text-anchor="start">exception. Non-NDA</text><text x="921" y="815" font-size="16" fill="#203944" font-weight="normal" text-anchor="start">paper stays in Legal</text><text x="921" y="838" font-size="16" fill="#203944" font-weight="normal" text-anchor="start">review.</text><path d="M 600 847 L 600 920" stroke="#56676d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="620" y="886" font-size="15" fill="#56676d" font-weight="bold" text-anchor="middle">Yes</text><rect x="365" y="920" width="470" height="100" rx="9" fill="#e9ede5" stroke="#b9c7ca"/><rect x="365" y="920" width="5" height="100" rx="2" fill="#3d6851"/><text x="386" y="951" font-size="20" fill="#3d6851" font-weight="bold" text-anchor="start">GREEN / eligible workflow</text><text x="386" y="980" font-size="17" fill="#203944" font-weight="normal" text-anchor="start">Approved delegation and signature controls</text><text x="386" y="1003" font-size="17" fill="#203944" font-weight="normal" text-anchor="start">still apply. Record the authorized approver.</text><path d="M 1025 467 L 1170 467 L 1170 1170 L 975 1170" stroke="#56676d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 1025 854 L 1025 1070 L 1170 1070" stroke="#56676d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 175 636 L 175 1170 L 225 1170" stroke="#56676d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M 600 1020 L 600 1120" stroke="#56676d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="225" y="1120" width="750" height="100" rx="9" fill="#ffffff" stroke="#b9c7ca"/><rect x="225" y="1120" width="5" height="100" rx="2" fill="#0a66c2"/><text x="246" y="1151" font-size="20" fill="#0a66c2" font-weight="bold" text-anchor="start">5  Resolve the gate and record the decision</text><text x="246" y="1180" font-size="17" fill="#203944" font-weight="normal" text-anchor="start">Named reviewer decisions, approved final text, delegation and release</text><text x="246" y="1203" font-size="17" fill="#203944" font-weight="normal" text-anchor="start">record. Re-run routing when relevant facts change.</text><path d="M 600 1220 L 600 1270" stroke="#56676d" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="225" y="1270" width="750" height="100" rx="9" fill="#e9ede5" stroke="#b9c7ca"/><rect x="225" y="1270" width="5" height="100" rx="2" fill="#0a66c2"/><text x="246" y="1301" font-size="20" fill="#0a66c2" font-weight="bold" text-anchor="start">6  Authorized signature, archive and obligations</text><text x="246" y="1330" font-size="17" fill="#203944" font-weight="normal" text-anchor="start">Retain signed set; assign delivery, acceptance, payment, renewal and</text><text x="246" y="1353" font-size="17" fill="#203944" font-weight="normal" text-anchor="start">insurance evidence owners.</text><text x="50" y="1402" font-size="16" fill="#56676d" font-weight="normal" text-anchor="start">Tracker risk bands and NDA workflow eligibility are separate controls.</text><text x="50" y="1427" font-size="13.3" fill="#56676d" font-weight="normal" text-anchor="start">Critical flags: personal data, controlled tech, shared training, unlimited liability, exclusivity/noncompete, residuals, sanctions/export.</text></g></svg>